services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentshield-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/state.db
      - PORT=8000
    volumes:
      - agentshield-data:/app/data
    command: >
      sh -c "python -m scripts.seed_demo_data && uvicorn api.main:create_app --factory --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentshield-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agentshield-data:
    name: agentshield-data
